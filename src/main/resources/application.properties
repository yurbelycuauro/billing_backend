spring.application.name=billing
server.port=${PORT:8080}
spring.profiles.default=${DB_PROFILE}
jwt.secret=${JWT_SECRET:change-this-development-secret-key-32-chars}
jwt.expiration=${JWT_EXPIRATION:PT5M}
jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION:P7D}
app.seed.admin.username=${INITIAL_ADMIN_USERNAME:admin@localhost}
app.seed.admin.password=${INITIAL_ADMIN_PASSWORD:ChangeMe123!}

# Configuración de JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
logging.level.com.mobile.billing=DEBUG
# Cambia esto a false para limpiar la consola
spring.jpa.show-sql=false


sendgrid.api-key=${SENDGRID_API_KEY}
sendgrid.from-email=${MAIL_FROM_ADDRESS:noreply@example.com}

app.exchange-rate.banco-central.base-url=${BANCO_CENTRAL_BASE_URL:https://si3.bcentral.cl/SieteRestWS/SieteRestWS.ashx}
app.exchange-rate.banco-central.token=${BANCO_CENTRAL_TOKEN:}
app.exchange-rate.banco-central.series-id=${BANCO_CENTRAL_SERIES_ID:F073.TCO.PRE.Z.D}
app.exchange-rate.banco-central.from-currency=${BANCO_CENTRAL_FROM_CURRENCY:USD}
app.exchange-rate.banco-central.to-currency=${BANCO_CENTRAL_TO_CURRENCY:CLP}

# Límite de tamaño para subir archivos
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Evita que Hibernate bloquee el inicio de la app intentando extraer metadatos
spring.jpa.properties.hibernate.temp.use_jdbc_metadata_defaults=false

# Configuración de tiempo de espera para HikariCP para evitar bloqueos infinitos
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.initialization-fail-timeout=0
