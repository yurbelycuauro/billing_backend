spring.application.name=billing
server.port=8081
# Configuración de Conexión a la BD
spring.datasource.url=jdbc:mysql://localhost:3306/billing?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuración de JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update

spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
logging.level.com.mobile.billing=DEBUG
# Cambia esto a false para limpiar la consola
spring.jpa.show-sql=false


sendgrid.api-key=${SENDGRID_API_KEY}
sendgrid.from-email=${MAIL_FROM_ADDRESS}

# Límite de tamaño para subir archivos
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB