name: Deploy API to Google Cloud Run

on:
  push:
    branches: [ "main" ]

# Permisos requeridos obligatoriamente por WIF para solicitar el token OIDC
permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  REGION: us-central1
  GAR_LOCATION: us-central1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/billing-repo/billing-api:latest

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout del código
      uses: actions/checkout@v4

    - name: Configurar Java 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: 'maven'

    - name: Compilar con Maven
      run: mvn clean package -DskipTests

    # Autenticación segura usando Workload Identity Federation (WIF)
    - name: Autenticación en Google Cloud vía WIF
      uses: google-github-actions/auth@v2
      with:
        workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
        service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

    - name: Configurar gcloud CLI
      uses: google-github-actions/setup-gcloud@v2

    - name: Autenticar Docker con Artifact Registry
      run: gcloud auth configure-docker us-central1-docker.pkg.dev --quiet

    - name: Construir y subir imagen Docker
      run: |
        docker build -t $GAR_LOCATION .
        docker push $GAR_LOCATION

    # Despliegue Serverless con inyección de credenciales de Supabase
    - name: Desplegar en Cloud Run
      run: |
        gcloud run deploy billing-api \
          --image $GAR_LOCATION \
          --region $REGION \
          --platform managed \
          --allow-unauthenticated \
          --min-instances=0 \
          --set-env-vars SPRING_DATASOURCE_URL="${{ secrets.SUPABASE_URL }}",SPRING_DATASOURCE_USERNAME="postgres",SPRING_DATASOURCE_PASSWORD="${{ secrets.SUPABASE_PASS }}"