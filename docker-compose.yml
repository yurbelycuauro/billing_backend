
services:
  api:
    build: .
    container_name: springboot_billing_api
    restart: always
    ports:
      - "8081:8081"
    env_file:
      - .env
    environment:
      # Usa DB_PROFILE=mysql o DB_PROFILE=postgresql en .env.
      SPRING_PROFILES_ACTIVE: ${DB_PROFILE:mysql}
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}

      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_JPA_SHOW_SQL: "true"
      
      # Evita que Hibernate intente validar o extraer esquemas incompatibles con el Pooler
      SPRING_JPA_PROPERTIES_HIBERNATE_TEMP_USE_JDBC_METADATA_DEFAULTS: "false"

      SENDGRID_API_KEY: ${SENDGRID_API_KEY}
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS}
      SENDGRID_TO_EMAIL: ${SENDGRID_TO_EMAIL}